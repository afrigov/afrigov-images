name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Smoke test the CLI
        run: |
          node dist/cli.js --version
          node -e "require('sharp')({create:{width:2000,height:1200,channels:3,background:'#336699'}}).jpeg().toFile('smoke.jpg')"
          node dist/cli.js smoke.jpg --kind hero --out smoke-out
